<div class="card">
  <div class="flex items-center gap-4">
    <div class="relative">
      <img 
        [src]="picture" 
        [alt]="name"
        class="w-16 h-16 rounded-full object-cover border-2 border-slate-200 dark:border-slate-600"
      />
      <div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 rounded-full border-2 border-white dark:border-slate-800"></div>
    </div>
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Hi, {{name}}!</h1>
      <p class="text-slate-600 dark:text-slate-300">{{email}}</p>
    </div>
  </div>
</div>
